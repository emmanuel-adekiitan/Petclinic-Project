name: "Terraform IaC & DevSecOps Pipeline"

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  checkov-iac-scan:
    name: "Checkov IaC Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: false
          skip_check: CKV2_AWS_11

  terraform-ci:
    name: "Terraform Lint & Plan"
    needs: checkov-iac-scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ./Terraform-Petclinic
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.9.0

      - name: Debug OIDC Token Claims
        uses: actions/github-script@v7
        with:
          script: |
            const idToken = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(idToken.split('.')[1], 'base64').toString());
            console.log('OIDC Token Claims:', JSON.stringify(payload, null, 2));

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::128793514564:role/Allow-Peclinic-repo
          aws-region: ca-central-1
          audience: sts.amazonaws.com

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}